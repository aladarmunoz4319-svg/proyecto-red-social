<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Becool | Nueva contraseña</title>
</head>
<body>
    <div class="wrapper">
        <form id="form-restablecer">
            <h1>Nueva contraseña</h1>

            <div class="input-box">
                <input type="password" id="nueva-password" placeholder="Nueva contraseña" required>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9zm-3 4h12v9H6z"></path>
                </svg>
            </div>

            <div class="input-box">
                <input type="password" id="nueva-password2" placeholder="Confirmar contraseña" required>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9zm-3 4h12v9H6z"></path>
                </svg>
            </div>

            <button type="submit" class="btn">Cambiar contraseña</button>

            <div class="register-link">
                <p><a href="index.html">Volver al inicio de sesión</a></p>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
