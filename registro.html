<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Becool | Registro</title>
</head>
<body>
    <div class="wrapper">
        <form id="form-registro">
            <h1>Crear Cuenta</h1>

            <div class="input-box">
                <input type="text" id="reg-usuario" placeholder="Usuario" required>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5m0-8c1.65 0 3 1.35 3 3s-1.35 3-3
                     3-3-1.35-3-3 1.35-3 3-3M4 22h16c.55 0 1-.45 1-1v-1c0-3.86-3.14-7-7-7h-4c-3.86 0-7 3.14-7 7v1c0 .55.
                     45 1 1 1m6-7h4c2.76 0 5 2.24 5 5H5c0-2.76 2.24-5 5-5"></path>
                </svg>
            </div>

            <div class="input-box">
                <input type="email" id="reg-correo" placeholder="Correo electrónico" required>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path d="M3 6h18v12H3z M3 6l9 7 9-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin
                    ="round" stroke-linecap="round"></path>
                </svg>
            </div>

            <div class="input-box">
                <input type="password" id="reg-password" placeholder="Contraseña" required>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .
                    9-2 2v9c0 1.1.9 2 2 2M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9zm-3 4h12v9H6z"></path>
                </svg>
            </div>

            <div class="input-box">
                <input type="password" id="reg-password2" placeholder="Confirmar contraseña" required>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .9-
                    2 2v9c0 1.1.9 2 2 2M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9zm-3 4h12v9H6z"></path>
                </svg>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox" required> Acepto los términos y condiciones</label>
            </div>

            <button type="submit" class="btn">Registrarme</button>

            <div class="register-link">
                <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
