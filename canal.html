    <div class="contenido">
        <main class="canal-pagina">

            <!-- Encabezado del canal-->
            <header class="canal-cab">
                <span class="canal-icono reveal-x">
                    <svg class="icono"><use id="canal-icono" href="#i-music"/></svg>
                </span>
                <div>
                    <h1 class="canal-titulo reveal-text" id="canal-nombre">Cargando…</h1>
                    <p class="canal-desc reveal-text" id="canal-desc"></p>
                </div>
            </header>

            <!-- Nueva publicación-->
            <form class="composer reveal" id="composer" novalidate>
                <span class="avatar" data-usuario="inicial"></span>
                <div class="composer-campo">
                    <textarea id="texto" rows="2" maxlength="1000" placeholder="¿Qué quieres compartir en este canal?" aria-label="Escribe tu publicación"></textarea>

                    <div class="preview" id="preview" hidden>
                        <img id="preview-img" alt="Vista previa de la foto">
                        <button type="button" class="preview-quitar" id="quitar-foto" aria-label="Quitar foto">
                            <svg class="icono"><use href="#i-close"/></svg>
                        </button>
                    </div>

                    <p class="canal-error" id="error" role="alert" hidden></p>

                    <div class="composer-barra">
                        <button type="button" class="btn-foto" id="btn-foto" aria-label="Adjuntar foto" title="Adjuntar foto">
                            <svg class="icono"><use href="#i-image"/></svg>
                        </button>
                        <input type="file" id="foto" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
                        <button type="submit" class="btn-publicar" id="enviar">Publicar</button>
                    </div>
                </div>
            </form>

            <section class="feed-canal" id="feed" aria-live="polite"></section>

        </main>
    </div>
