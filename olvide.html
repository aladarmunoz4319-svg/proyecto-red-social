<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Becool | Recuperar contraseña</title>
</head>
<body>
    <div class="wrapper">
        <form id="form-olvide">
            <h1>Recuperar contraseña</h1>

            <div class="input-box">
                <input type="email" id="olvide-correo" placeholder="Tu correo electrónico" required>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path d="M3 6h18v12H3z M3 6l9 7 9-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
                </svg>
            </div>

            <button type="submit" class="btn">Enviar enlace</button>

            <div class="register-link">
                <p><a href="index.html">Volver al inicio de sesión</a></p>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
