<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becool | Chat de Deportes</title>
    <link rel="stylesheet" href="css/chatsport.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="chat-container">
        

        <header class="channel-header">
            <div class="header-info">
                <a href="indextwo.html" class="btn-back" title="Volver a Inicio">←</a>
                <div class="channel-avatar">⚽</div>
                <div>
                    <h1>Deportes</h1>
                    <p>Canal oficial • Comparte jugadas, fotos, boxeo y más</p>
                </div>
            </div>
            <div class="brand-tag">
                <span>Be</span><span class="lime">cool</span>
            </div>
        </header>

      
        <main class="feed-area" id="feed">

            <article class="post-card">
                <div class="post-top">
                    <div class="user-avatar">A</div>
                    <div class="user-meta">
                        <strong>Aladar</strong>
                        <span>hace 12 min</span>
                    </div>
                </div>
                <p class="post-caption">HALA MADRID PERROS</p>
                <div class="post-photo">
                    <img src="C:\xampp\htdocs\red-social\css\imagenes\deportmadrid.png">
                </div>
                <div class="post-footer">
                    <button class="btn-like liked">❤️ <span class="count">15</span></button>
                    <button class="btn-comment">💬 <span class="count">3</span></button>
                </div>
            </article>

            <article class="post-card">
                <div class="post-top">
                    <div class="user-avatar">M</div>
                    <div class="user-meta">
                        <strong>Maurix</strong>
                        <span>hace 4 min</span>
                    </div>
                </div>
                <p class="post-caption">Aladar: probando el canal de deportes en Becool 🥊🏆</p>
                <div class="post-footer">
                    <button class="btn-like">🤍 <span class="count">6</span></button>
                    <button class="btn-comment">💬 <span class="count">1</span></button>
                </div>
            </article>

        </main>

        <div id="preview-box" class="preview-box" style="display: none;">
            <img id="preview-img" src="" alt="Vista previa">
            <button type="button" id="btn-remove-img" class="btn-remove-img">✕</button>
        </div>

        <form class="input-bar" id="chat-form">
            <label for="input-foto" class="btn-photo" title="Adjuntar foto">📷</label>
            <input type="file" id="input-foto" accept="image/*" hidden>
            
            <input type="text" id="input-texto" placeholder="Comenta sobre el partido, pelea o sube una foto..." autocomplete="off">
            
            <button type="submit" class="btn-send">Enviar</button>
        </form>

    </div>
<canvas id="estela-neon"></canvas>
    <script src="chatsport.js"></script>
</body>
</html>
