<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becool | Chat de Memes</title>
    <link rel="stylesheet" href="css/chatmemes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="chat-container">
        
        
        <header class="channel-header">
            <div class="header-info">
                <a href="indextwo.html" class="btn-back" title="Volver a Inicio">←</a>
                <div class="channel-avatar">😂</div>
                <div>
                    <h1>Memes</h1>
                    <p>Canal oficial • Sube tus mejores memes, plantillas y risas</p>
                </div>
            </div>
            <div class="brand-tag">
                <span>Be</span><span class="lime">cool</span>
            </div>
        </header>

        <!-- Área de publicaciones / memes -->
        <main class="feed-area" id="feed">

            <!-- Publicación 1 -->
            <article class="post-card">
                <div class="post-top">
                    <div class="user-avatar">M</div>
                    <div class="user-meta">
                        <strong>Maurix</strong>
                        <span>hace 1h</span>
                    </div>
                </div>
                <p class="post-caption">Cuando por fin te funciona el login después de dos días, 5 monsters y 10 tacos de...</p>
                <div class="post-photo">
                    <img src="https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=800&q=80" alt="Meme de risas">
                </div>
                <div class="post-footer">
                    <button class="btn-like liked">❤️ <span class="count">24</span></button>
                    <button class="btn-comment">💬 <span class="count">5</span></button>
                </div>
            </article>

            <!-- Publicación 2  -->
            <article class="post-card">
                <div class="post-top">
                    <div class="user-avatar">A</div>
                    <div class="user-meta">
                        <strong>Aladar</strong>
                        <span>hace 8 min</span>
                    </div>
                </div>
                <p class="post-caption">probando memes en Becool 😂🔥</p>
                <div class="post-footer">
                    <button class="btn-like">🤍 <span class="count">7</span></button>
                    <button class="btn-comment">💬 <span class="count">1</span></button>
                </div>
            </article>

        </main>

        <!-- Previsualización rápida cuando seleccionas una foto -->
        <div id="preview-box" class="preview-box" style="display: none;">
            <img id="preview-img" src="" alt="Vista previa">
            <button type="button" id="btn-remove-img" class="btn-remove-img">✕</button>
        </div>

        <!-- Barra inferior para subir meme y enviar -->
        <form class="input-bar" id="chat-form">
            <label for="input-foto" class="btn-photo" title="Subir meme">📷</label>
            <input type="file" id="input-foto" accept="image/*" hidden>
            
            <input type="text" id="input-texto" placeholder="Ponle contexto o sube un meme..." autocomplete="off">
            
            <button type="submit" class="btn-send">Enviar</button>
        </form>

    </div>
<canvas id="estela-neon"></canvas>
    
    <script src="chatmemes.js"></script>
</body>
</html>
