<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becool | Mi perfil</title>
    <link rel="stylesheet" href="css/styletwo.css">
    <link rel="stylesheet" href="css/derecha.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="js/inicio.js"></script>
    <script src="js/barra.js" defer></script>
    <script src="js/sesion.js" defer></script>
</head>
<body>

    <!-- Íconos -->
    <svg class="sprite" aria-hidden="true">
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5v16h4"/><path d="m16 8 4 4-4 4"/><path d="M20 12H9"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
        <symbol id="i-comment" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
        <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></symbol>
        <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 8 3.5 2.5-1.3 4.1H9.8l-1.3-4.1z"/></symbol>
        <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c1 1.5 2.3 2 3.5 2s2.5-.5 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01"/></symbol>
    </svg>

    <!--Contenido-->
   <div class="contenido">
        <main class="perfil-pagina">

            <header class="perfil-cab">
                <span class="avatar avatar-grande reveal-text" data-usuario="inicial"></span>
                <h1 class="perfil-nombre reveal-text" data-usuario="nombre"></h1>
                <a href="configuracion.html" class="btn-sec reveal-text">Editar perfil</a>
            </header>

            <section class="perfil-seccion reveal">
                <p class="etiqueta">Biografía</p>
                <p class="perfil-bio" data-usuario="bio"></p>
            </section>

        </main>
    </div>
</body>
</html>
